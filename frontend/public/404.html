<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA 重定向
    // 将当前路径保存到 sessionStorage，然后跳转到首页
    var pathSegmentsToKeep = 1; // 保留仓库名：/monotasking-pomodoro
    var l = window.location;
    var redirectPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/'
      + l.search; // 保留查询参数
    var routePath = l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/')
      + l.search + l.hash;
    sessionStorage.setItem('gh-pages-redirect', '/' + routePath);
    l.replace(redirectPath);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
